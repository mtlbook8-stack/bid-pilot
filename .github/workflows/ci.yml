name: ci

# Runs on every push and PR to validate the codebase before anything is built or
# deployed: lint + unit tests (Python), typecheck + build (frontend), and a
# `bicep build` to catch IaC mistakes early. Deployment is in deploy.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: python lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest

  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  bicep:
    name: bicep build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep CLI
        run: az bicep install
      - name: Build main.bicep
        run: az bicep build --file infra/main.bicep

  docker:
    name: docker build (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: bidpilot-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
